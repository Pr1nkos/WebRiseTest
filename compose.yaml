services:
  webrisetest-app:
    build: .
    image: webrisetest:latest
    container_name: webrisetest-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/web_rise
      SPRING_DATASOURCE_USERNAME: web_rise
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      - postgres-db
    restart: unless-stopped

  # База данных PostgreSQL
  postgres-db:
    image: postgres:latest
    container_name: webrisetest-postgres
    environment:
      POSTGRES_USER: web_rise
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: web_rise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: