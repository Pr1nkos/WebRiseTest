            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_subscription
                  name: id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: user_id
                  type: BIGINT
            tableName: subscription
  - changeSet:
      id: 1747133692021-3
      author: prink
